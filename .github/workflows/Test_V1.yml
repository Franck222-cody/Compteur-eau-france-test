name: Test Collecteur V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-v1:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lancer Collecteur V1
        run: python Collecteur_v1.py

      - name: Enregistrer les resultats V1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_v1/

          if git diff --cached --quiet; then
            echo "Aucun changement a enregistrer"
          else
            git commit -m "Test automatique Collecteur V1"
            git push
          fi
