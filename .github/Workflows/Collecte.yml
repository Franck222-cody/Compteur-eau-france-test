name: Test compteur eau

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester Seine a Vernon
        run: python Collecteur.py
